name: CI

# Valida toda PR (e a main depois do merge): Portal, site, Python, banco (migrations + RLS)
# e varredura de segredos. Os nomes dos jobs são os checks exigidos na proteção da main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    name: portal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Aplicativo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Aplicativo/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Sem variáveis de ambiente: o build não depende de segredos.
      - run: npm run build

  site:
    name: site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Aplicativo/coletor/requirements.txt
      - run: pip install -r Aplicativo/coletor/requirements.txt
      - name: Compilar scripts
        run: python -m compileall -q Aplicativo/coletor Aplicativo/supabase/scripts Aplicativo/supabase/testes
      - name: Testes do coletor
        run: python -m unittest discover -s Aplicativo/coletor -p "test_*.py" -v

  banco:
    name: banco
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Aplicativo/coletor/requirements.txt
      - run: pip install -r Aplicativo/coletor/requirements.txt
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Sobe o Postgres do Supabase (schemas auth, papéis anon/authenticated) e aplica
      # todas as migrations de Aplicativo/supabase/migrations.
      - name: Subir banco local com as migrations
        working-directory: Aplicativo
        run: supabase db start
      # Testes de RLS e permissões rodam sempre; os de cálculo pulam sem a carga do BCB.
      - name: Testes do banco
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: python Aplicativo/supabase/testes/testar_banco.py

  segredos:
    name: segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
