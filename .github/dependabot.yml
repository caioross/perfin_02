version: 2
updates:
  - package-ecosystem: npm
    directory: /Aplicativo
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # typescript-eslint (via eslint-config-next) ainda não suporta TypeScript 7:
    # o lint quebra. Reavaliar quando houver suporte (typescript-eslint#10940).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /Website
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # typescript-eslint (via eslint-config-next) ainda não suporta TypeScript 7:
    # o lint quebra. Reavaliar quando houver suporte (typescript-eslint#10940).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directory: /Aplicativo/coletor
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
